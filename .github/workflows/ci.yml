name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun astro check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          PUBLIC_CLARITY_TRACKING_ID: ${{ vars.PUBLIC_CLARITY_TRACKING_ID }}

      - name: Lighthouse CI
        run: bunx lhci autorun
        env:
          PUBLIC_CLARITY_TRACKING_ID: ${{ vars.PUBLIC_CLARITY_TRACKING_ID }}
          # Disables Astro's agent auto-detach so the preview server stays in the
          # foreground and LHCI can manage its lifecycle.
          ASTRO_PREVIEW_BACKGROUND: "1"

      - name: Check render-blocking third parties
        run: node scripts/check-render-blocking-third-parties.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          PUBLIC_CLARITY_TRACKING_ID: ${{ vars.PUBLIC_CLARITY_TRACKING_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
